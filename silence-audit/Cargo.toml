[package]
name = "silence-audit"
version = "0.1.0"
edition = "2021"

[dependencies]
gstreamer = "0.24"
gstreamer-audio = { version = "0.24", features = ["v1_22"] }
gtk4 = "0.10"
glib = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
gstreamer = "0.24"
