[package]
name = "vkri-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Video Keyframe Rebuild Index: project model, storage, evidence and export logic"

[features]
default = ["gstreamer"]
gstreamer = ["dep:glib", "dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-pbutils"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
walkdir.workspace = true
csv.workspace = true
glib = { workspace = true, optional = true }
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-pbutils = { workspace = true, optional = true }

[dev-dependencies]
uuid.workspace = true
