[package]
name = "vkri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command line interface for the Video Keyframe Rebuild Index tool"

[[bin]]
name = "vkri"
path = "src/main.rs"

[dependencies]
vkri-core = { path = "../vkri-core" }
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
chrono.workspace = true
anyhow = "1"
ctrlc = "3"
