[package]
name = "hls-resume-lab"
version = "0.1.0"
edition = "2021"
description = "Replayable HLS resume-point diagnosis lab (Rust + GStreamer + GTK4)"

[lib]
name = "hls_resume_lab"
path = "src/lib.rs"

[[bin]]
name = "hls-lab"
path = "src/main.rs"

[features]
default = []
gtk = ["dep:gtk", "dep:glib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gstreamer = "0.24"
gstreamer-app = "0.24"
gtk = { package = "gtk4", version = "0.10", optional = true }
glib = { version = "0.21", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "unwind"
