[package]
name = "mask-edge-review"
version = "0.1.0"
edition = "2021"
description = "Local video mask edge review with three resumable segments"

[dependencies]
anyhow = "1"
cairo-rs = { version = "0.22", features = ["use_glib"] }
chrono = { version = "0.4", features = ["serde"] }
gst = { package = "gstreamer", version = "0.25" }
gst_app = { package = "gstreamer-app", version = "0.25" }
gst_pbutils = { package = "gstreamer-pbutils", version = "0.25" }
gst_video = { package = "gstreamer-video", version = "0.25" }
gtk4 = { version = "0.11", features = ["v4_10"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
