[package]
name = "noise-provenance"
version = "0.1.0"
edition = "2021"
description = "音频噪声频谱标注 · 来源检查页 (Rust + GStreamer + GTK4)"

[dependencies]
gtk4 = { version = "0.10", features = ["v4_10"] }
gstreamer = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 2
