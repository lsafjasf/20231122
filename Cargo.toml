[workspace]
resolver = "2"
members = ["crates/dub-core", "crates/dub-cli", "crates/dub-gui"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
anyhow = "1"
gstreamer = "0.23"
glib = "0.20"
gtk4 = "0.9"
libc = "0.2"
