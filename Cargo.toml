[package]
name = "backpressure-inspector"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_22"] }
gst = { package = "gstreamer", version = "0.25.4", features = ["v1_28"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
