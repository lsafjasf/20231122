[package]
name = "hdr-repair"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Pauseable camera HDR metadata repair workbench"
default-run = "hdr-repair"

[lib]
name = "hdr_repair"
path = "src/lib.rs"

[[bin]]
name = "hdr-repair"
path = "src/main.rs"

[[bin]]
name = "hdr-repair-fixture"
path = "src/bin/make_fixture.rs"

[features]
default = ["gui"]
gui = ["dep:gtk4"]

[dependencies]
anyhow = "1"
crc32fast = "1"
gstreamer = "0.25"
gstreamer-app = "0.25"
gtk4 = { version = "0.11", optional = true, features = ["v4_12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
