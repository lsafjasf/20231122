[package]
name = "frame-loss-review"
version = "0.1.0"
edition = "2024"
description = "Auditable video frame-loss compensation replay"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
gstreamer = { version = "0.25", features = ["v1_28"], optional = true }
gstreamer-app = { version = "0.25", optional = true }
gtk4 = { version = "0.11", features = ["v4_22"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
hex = "0.4"

[dev-dependencies]
tempfile = "3.20"

[features]
default = ["desktop", "gstreamer"]
desktop = ["dep:gtk4"]
gstreamer = ["dep:gstreamer", "dep:gstreamer-app"]
