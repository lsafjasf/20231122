[workspace]
members = [
    "crates/credits-core",
    "crates/credits-engine",
    "crates/credits-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1.0"
cairo-rs = "0.21"
clap = { version = "4.5", features = ["derive"] }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-audio = "0.25"
gstreamer-pbutils = "0.25"
gstreamer-video = "0.25"
gtk4 = "0.11"
hex = "0.4"
pangocairo = "0.21"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"

[profile.release]
lto = "thin"
strip = true
