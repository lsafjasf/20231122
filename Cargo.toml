[package]
name = "bwf-replay-lab"
version = "0.1.0"
edition = "2024"
description = "Replayable BWF time-marker validation experiment"
license = "MIT"

[dependencies]
anyhow = "1.0"
gstreamer = { version = "0.25.4", features = ["v1_28"] }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_16"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3.20"

[profile.dev]
debug = 1

