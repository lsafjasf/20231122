[package]
name = "encode-panel"
version = "0.1.0"
edition = "2024"
description = "Real-time GStreamer encoding statistics panel with a GTK4 waveform view"
license = "MIT"

[lib]
name = "encode_panel"
path = "src/lib.rs"

[[bin]]
name = "encode-panel"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
cairo-rs = "0.22"
gtk4 = "0.11"
gstreamer = "0.25"
gstreamer-app = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = true
