[package]
name = "alc-review"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Auditable audio packet-loss concealment replay review"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
gst = { package = "gstreamer", version = "0.25.4", features = ["v1_28"] }
gst-app = { package = "gstreamer-app", version = "0.25.2", features = ["v1_28"] }
gtk4 = { version = "0.11.5", features = ["v4_22"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
