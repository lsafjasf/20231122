[workspace]
resolver = "2"
members = [
    "crates/downmix-core",
    "crates/downmix-cli",
    "crates/downmix-gtk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-audio = "0.25"
gstreamer-pbutils = "0.25"
gtk4 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tempfile = "3"
walkdir = "2"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
downmix-core = { path = "crates/downmix-core" }

[profile.release]
panic = "unwind"

[profile.dev]
opt-level = 0
