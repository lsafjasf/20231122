[package]
name = "media-meta-replay"
version = "0.1.0"
edition = "2024"
description = "Replayable media metadata comparison experiment (Rust, GStreamer, GTK4)"
default-run = "media-meta-replay"

[features]
default = []
desktop = ["dep:gstreamer", "dep:gstreamer-pbutils", "dep:gtk4"]

[dependencies]
gstreamer = { version = "0.25.4", optional = true }
gstreamer-pbutils = { version = "0.25.4", optional = true }
gtk4 = { version = "0.11.5", features = ["v4_10"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "media-meta-replay"
path = "src/main.rs"

[[bin]]
name = "media-meta-ui"
path = "src/bin/media-meta-ui.rs"
required-features = ["desktop"]
