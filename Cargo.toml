[package]
name = "peakguard"
version = "0.1.0"
edition = "2024"
description = "Audio peak warning local correction workbench"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
gstreamer = "0.25"
gstreamer-pbutils = "0.25"
gtk4 = { version = "0.11", features = ["v4_12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
