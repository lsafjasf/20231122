[package]
name = "source-ledger"
version = "0.1.0"
edition = "2021"
description = "Media packaging source-check ledger (Rust + GStreamer + GTK4)"

[dependencies]
anyhow = "1"
gstreamer = "0.24"
gstreamer-pbutils = "0.24"
gtk4 = "0.10"
pango = { version = "0.21", features = ["v1_56"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
debug = true
