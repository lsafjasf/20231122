[package]
name = "timecode-drift-replay"
version = "0.1.0"
edition = "2021"
description = "Pausable timecode-drift replay with Rust, GStreamer and GTK4"

[dependencies]
anyhow = "1"
glib = "0.20"
gstreamer = "0.23"
gstreamer-app = "0.23"
gtk4 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
