[package]
name = "proxyrecover"
version = "0.1.0"
edition = "2021"
description = "Replayable media proxy invalidation/recovery experiment (Rust + GStreamer + GTK4)"

[dependencies]
gstreamer = "0.25"
gstreamer-app = "0.25"
gtk4 = { version = "0.11", features = ["v4_14"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = true

