[package]
name = "plvcmp"
version = "0.1.0"
edition = "2021"
description = "Pausable playlist version comparison pipeline (Rust + GStreamer + GTK4)"

[dependencies]
gstreamer = "0.24"
gtk4 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
async-channel = "2"

[profile.release]
debug = true
