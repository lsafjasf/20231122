[package]
name = "mouse-trail-rebuild"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deterministic screen-recording mouse trajectory overlay and evidence tool"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
gtk4 = { version = "0.11", features = ["v4_8"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
