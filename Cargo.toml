[package]
name = "subtitle-font-coverage"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk4 = { version = "0.10", features = ["v4_10"] }
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-pbutils = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
anyhow = "1"
pangocairo = "0.21"
