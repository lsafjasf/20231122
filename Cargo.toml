[package]
name = "loudness-segment-calibrator"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Pausable three-anchor loudness segment calibration with GStreamer and GTK4"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
gstreamer = "0.25"
gstreamer-app = "0.25"
gtk4 = "0.11"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
