[package]
name = "tempo-pitch-debug"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
default-run = "tempo-pitch-debug"
description = "Auditable tempo/pitch debug playback built with Rust, GStreamer and GTK4"
license = "MIT"

[features]
default = ["gst", "gui"]
gst = [
    "dep:gstreamer",
    "dep:gstreamer-app",
]
gui = ["dep:gtk4", "gst"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gtk4 = { version = "0.11", optional = true, features = ["v4_10"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[[bin]]
name = "tempo-pitch-debug"
path = "src/main.rs"
required-features = ["gst"]

[[bin]]
name = "tempo-pitch-gui"
path = "src/bin/tempo-pitch-gui.rs"
required-features = ["gui"]
