[package]
name = "audio-undo-lab"
version = "0.1.0"
edition = "2024"
description = "Replayable audio-clip undo history experiment using Rust, GStreamer, and GTK4"

[features]
default = ["ui"]
ui = ["dep:gtk4"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
gstreamer = "0.25"
gstreamer-app = "0.25"
gtk4 = { version = "0.11", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"

[profile.release]
strip = "symbols"
lto = "thin"
