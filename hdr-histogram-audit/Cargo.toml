[workspace]
resolver = "2"
members = [
    "crates/audit-core",
    "crates/gst-source",
    "crates/gtk4-ui",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
audit-core = { path = "crates/audit-core" }
gst-source = { path = "crates/gst-source" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
gstreamer = "0.24"
gstreamer-video = "0.24"
gstreamer-app = "0.24"
gtk = { package = "gtk4", version = "0.10" }
