[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gtk-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
gstreamer = "0.25"
gstreamer-app = "0.25"
gtk4 = "0.10"
glib = "0.21"
anyhow = "1"
thiserror = "2"
